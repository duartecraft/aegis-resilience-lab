# Validação da aplicação. Não usa credenciais de nuvem e não publica imagem.
#
# Antes de habilitar em um repositório remoto, fixe cada action pelo SHA do
# commit correspondente à versão indicada, em vez da tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credencial descartável do contêiner de teste, válida apenas neste job.
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/aegis_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Instalar dependências com verificação de hash
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatação
        run: ruff format --check .
      - name: Testes de unidade e de integração
        run: pytest

  scripts:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  image:
    name: Build da imagem (sem publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag aegis-resilience-lab/app:ci app
      - name: Imagem não roda como root
        run: test "$(docker run --rm --entrypoint id aegis-resilience-lab/app:ci -u)" != "0"
